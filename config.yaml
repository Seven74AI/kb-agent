# KB Agent configuration

# Paths
kb_agent_dir: /root/kb-agent
vault_path: /root/Documents/Obsidian Vault
cookie_dir: /root/kb-agent/cookies
temp_dir: /tmp

# Concurrency
video_semaphore: 1      # Only one video pipeline at a time (pyannote RAM)
text_parallel: 3        # Parallel text pipelines

# Watch sources
watch_scheduler_enabled: true   # false = cron (scripts/watch_sources_poll.py) polls instead

# Retry (exponential backoff)
retry_delays: [5, 15, 60, 180]
max_retries: 5

# Quality gate thresholds
quality:
  book_min_lines: 100
  book_min_quotes: 4
  book_min_size: 8000
  article_min_quotes: 4
  article_min_size: 5000
  youtube_min_concepts: 3
  youtube_min_key_points: 8
  youtube_min_density: 100
  threads_video_min_density: 100
  threads_text_min_quotes: 2
  threads_text_min_size: 2000
  ig_reel_min_concepts: 2
  ig_reel_min_key_points: 3
  ig_carousel_min_size: 2000

# LLM
llm_provider: deepseek       # deepseek or edgee
llm_model: deepseek-v4-pro
llm_base_url: https://api.deepseek.com/v1
edgee_api_key: ""             # EDGEE_API_KEY from .env (separate from DEEPSEEK_API_KEY)
# When llm_provider=edgee, set llm_base_url: https://api.edgee.ai/v1

# Object storage
storage_bucket: knowledge-base

# Firecrawl (shared with Hermes)
firecrawl_url: http://localhost:3002/v2/scrape

# API auth (required when binding beyond loopback). KB_API_TOKEN in .env overrides this.
api_token: ""

# Webhook — loopback by default; bind 0.0.0.0 only with api_token set and an edge/tunnel.
webhook_host: 127.0.0.1
webhook_port: 5000

# Notifications (Telegram) — set the real values in .env (KB_TELEGRAM_BOT_TOKEN / KB_TELEGRAM_CHAT_ID)
telegram_bot_token: ""
telegram_chat_id: ""

# MCP tracer (stateless streamable HTTP) — loopback by default; expose via tunnel + api_token.
mcp_host: 127.0.0.1
mcp_port: 8002
mcp_path: /mcp

# Transcription (cpu = local pyannote + faster-whisper; modal = GPU on Modal A10)
transcription_backend: cpu
modal_cli: /root/modal/venv/bin/modal
