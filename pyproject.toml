[project]
name = "kb-agent"
version = "0.1.0"
description = "Custom knowledge base pipeline agent — replaces Hermes-based ingestion, orchestration, and synthesis layers"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "fastmcp>=4.0,<4.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
